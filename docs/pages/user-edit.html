<!doctype html>
<html lang="en">
<head>
    <!-- Technical information -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User | Notes Service</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/app.js" defer></script>
</head>
<body class="site-body">
    <div class="page-shell">
        <!-- Header -->
        <header class="page-header">
            <div class="page-header__inner">
                <div class="page-brand">Notes Service</div>
                <nav class="page-nav" aria-label="Main navigation">
                    <a class="page-nav__link" href="login.html">Login</a>
                    <a class="page-nav__link page-nav__link--active" href="users.html">Users</a>
                    <a class="page-nav__link" href="notes.html">Notes</a>
                    <a class="page-nav__link page-nav__link--logout" href="login.html">Logout</a>
                </nav>
            </div>
        </header>

        <!-- Main content -->
        <main class="page-main page-main--centered">
            <section class="dialog" aria-labelledby="edit-user-title">
                <h1 id="edit-user-title" class="page-title">Edit User</h1>

                <div id="user-edit-feedback" class="alert alert--success" role="status" hidden>
                </div>

                <form id="edit-user-form" class="form" action="#" method="post">
                    <div class="form__group">
                        <label class="form__label" for="edit-username">Username</label>
                        <input
                            class="form__input"
                            id="edit-username"
                            name="username"
                            type="text"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="edit-password">Password</label>
                        <input
                            class="form__input"
                            id="edit-password"
                            name="password"
                            type="password"
                            placeholder="Enter a new password"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="edit-confirm-password">Confirm password</label>
                        <input
                            class="form__input"
                            id="edit-confirm-password"
                            name="confirmPassword"
                            type="password"
                            placeholder="Repeat the new password"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="edit-role">Role</label>
                        <select class="form__select" id="edit-role" name="role">
                            <option value="Regular">Regular</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <div class="actions">
                        <button class="button" type="submit">Ok</button>
                        <a class="button button--secondary" href="users.html">Cancel</a>
                    </div>
                </form>
            </section>
        </main>

        <!-- Footer -->
        <footer class="page-footer">
            <div class="page-footer__inner">
                Interactive client for Lab 2
            </div>
        </footer>
    </div>
</body>
</html>
