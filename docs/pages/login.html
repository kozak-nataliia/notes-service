<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Notes Service</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/app.js" defer></script>
</head>
<body class="site-body">
    <div class="page-shell">
        <header class="page-header">
            <div class="page-header__inner">
                <div class="page-brand">Notes Service</div>
                <nav class="page-nav" aria-label="Main navigation">
                    <a class="page-nav__link page-nav__link--active" href="login.html">Login</a>
                </nav>
            </div>
        </header>

        <main class="page-main page-main--centered">
            <section class="dialog" aria-labelledby="login-title">
                <h1 id="login-title" class="page-title">Login</h1>
                <p class="page-subtitle">Sign in to open your notes and continue where you left off.</p>

                <div id="login-feedback" class="alert alert--error" role="alert" hidden>
                </div>

                <form id="login-form" class="form" action="#" method="post">
                    <div class="form__group">
                        <label class="form__label" for="username">Username</label>
                        <input
                            class="form__input"
                            id="username"
                            name="username"
                            type="text"
                            placeholder="Enter username"
                            value=""
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="password">Password</label>
                        <input
                            class="form__input"
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Enter password"
                        >
                    </div>

                    <div class="actions">
                        <button class="button" type="submit">Login</button>
                        <a class="button button--secondary" href="register.html">Create account</a>
                    </div>
                </form>
            </section>
        </main>

        <footer class="page-footer">
            <div class="page-footer__inner">
                Notes Service
            </div>
        </footer>
    </div>
</body>
</html>
