<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Notes Service</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/app.js" defer></script>
</head>
<body class="site-body">
    <div class="page-shell">
        <header class="page-header">
            <div class="page-header__inner">
                <div class="page-brand">Notes Service</div>
                <nav class="page-nav" aria-label="Main navigation">
                    <a class="page-nav__link page-nav__link--active" href="register.html">Register</a>
                </nav>
            </div>
        </header>

        <main class="page-main page-main--centered">
            <section class="dialog" aria-labelledby="register-title">
                <h1 id="register-title" class="page-title">Create Account</h1>
                <p class="page-subtitle">Create an account to start saving and organizing notes.</p>

                <div id="register-feedback" class="alert alert--success" role="status" hidden></div>

                <form id="register-form" class="form" action="#" method="post">
                    <div class="form__group">
                        <label class="form__label" for="register-username">Username</label>
                        <input
                            class="form__input"
                            id="register-username"
                            name="username"
                            type="text"
                            placeholder="Choose a username"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="register-password">Password</label>
                        <input
                            class="form__input"
                            id="register-password"
                            name="password"
                            type="password"
                            placeholder="Choose a password"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="register-confirm-password">Confirm password</label>
                        <input
                            class="form__input"
                            id="register-confirm-password"
                            name="confirmPassword"
                            type="password"
                            placeholder="Repeat your password"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="register-role">Role</label>
                        <select class="form__select" id="register-role" name="role">
                            <option value="Regular">Regular</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <p class="helper-text">Choose the role for this new account.</p>

                    <div class="actions">
                        <button class="button" type="submit">Register</button>
                        <a class="button button--secondary" href="login.html">Back to login</a>
                    </div>
                </form>
            </section>
        </main>

        <footer class="page-footer">
            <div class="page-footer__inner">
                Notes Service
            </div>
        </footer>
    </div>
</body>
</html>
