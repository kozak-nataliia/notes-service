<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Details | Notes Service</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/app.js" defer></script>
</head>
<body class="site-body">
    <div class="page-shell">
        <header class="page-header">
            <div class="page-header__inner">
                <div class="page-brand">Notes Service</div>
                <nav class="page-nav" aria-label="Main navigation">
                    <a class="page-nav__link" href="login.html" hidden>Login</a>
                    <a class="page-nav__link page-nav__link--active" href="users.html" hidden>Users</a>
                    <a class="page-nav__link" href="notes.html">Notes</a>
                    <a class="page-nav__link page-nav__link--logout" href="login.html" hidden>Logout</a>
                </nav>
            </div>
        </header>

        <main class="page-main">
            <div class="page-toolbar">
                <div>
                    <h1 class="page-title">User Profile</h1>
                    <p class="page-subtitle">Account information and note ownership summary.</p>
                </div>
                <div class="toolbar-actions">
                    <a class="button button--secondary" href="users.html">Back to users</a>
                </div>
            </div>

            <section class="card details-card" aria-labelledby="user-details-title">
                <h2 id="user-details-title" class="section-title">Selected user</h2>
                <div id="user-details-feedback" class="alert alert--error" role="alert" hidden></div>

                <div class="details-list">
                    <div class="details-row">
                        <span class="details-label">Username</span>
                        <span id="user-username" class="details-value">Loading...</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Role</span>
                        <span id="user-role" class="details-value">Loading...</span>
                    </div>
                    <div class="details-row">
                        <span class="details-label">Created notes</span>
                        <span id="user-notes-count" class="details-value">0</span>
                    </div>
                </div>

                <div class="actions">
                    <a id="edit-user-link" class="button" href="user-edit.html">Edit user</a>
                    <button id="delete-user-button" class="button button--danger" type="button">Delete user</button>
                </div>
            </section>
        </main>

        <footer class="page-footer">
            <div class="page-footer__inner">
                Notes Service
            </div>
        </footer>
    </div>
</body>
</html>
