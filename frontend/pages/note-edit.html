<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Note | Notes Service</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/app.js" defer></script>
</head>
<body class="site-body">
    <div class="page-shell">
        <header class="page-header">
            <div class="page-header__inner">
                <div class="page-brand">Notes Service</div>
                <nav class="page-nav" aria-label="Main navigation">
                    <a class="page-nav__link" href="login.html" hidden>Login</a>
                    <a class="page-nav__link" href="users.html" hidden>Users</a>
                    <a class="page-nav__link page-nav__link--active" href="notes.html">Notes</a>
                    <a class="page-nav__link page-nav__link--logout" href="login.html" hidden>Logout</a>
                </nav>
            </div>
        </header>

        <main class="page-main page-main--centered">
            <section class="dialog" aria-labelledby="edit-note-title">
                <h1 id="edit-note-title" class="page-title">Edit Note</h1>

                <div id="note-edit-feedback" class="alert alert--success" role="status" hidden>
                </div>

                <form id="edit-note-form" class="form" action="#" method="post">
                    <div class="form__group">
                        <label class="form__label" for="edit-note-title-field">Title</label>
                        <input
                            class="form__input"
                            id="edit-note-title-field"
                            name="title"
                            type="text"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="edit-note-content">Content</label>
                        <textarea
                            class="form__textarea"
                            id="edit-note-content"
                            name="content"
                        ></textarea>
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="edit-note-tags">Tags</label>
                        <input
                            class="form__input"
                            id="edit-note-tags"
                            name="tags"
                            type="text"
                        >
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="edit-note-owner">Owner</label>
                        <select class="form__select" id="edit-note-owner" name="userId">
                            <option>Loading users...</option>
                        </select>
                    </div>

                    <div class="form__group">
                        <p class="helper-text">Last updated: <span id="note-last-updated">Not available</span></p>
                    </div>

                    <div class="actions">
                        <button class="button" type="submit">Save changes</button>
                        <a class="button button--secondary" href="notes.html">Cancel</a>
                    </div>
                </form>
            </section>
        </main>

        <footer class="page-footer">
            <div class="page-footer__inner">
                Notes Service
            </div>
        </footer>
    </div>
</body>
</html>
